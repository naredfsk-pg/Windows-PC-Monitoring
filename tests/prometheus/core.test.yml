rule_files:
  - ../../config/recording-rules/core.yml

evaluation_interval: 15s
# Ignore only the last mantissa bit introduced by rate() floating-point arithmetic.
fuzzy_compare: true

tests:
  - name: process_cpu_uses_total_host_capacity_and_memory_uses_bytes
    interval: 15s
    input_series:
      - series: 'windows_cpu_time_seconds_total{job="windows_exporter",instance="local",core="0",mode="idle"}'
        values: '0+7.5x8'
      - series: 'windows_cpu_time_seconds_total{job="windows_exporter",instance="local",core="1",mode="idle"}'
        values: '0+7.5x8'
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="example_app",process_id="42",mode="user"}'
        values: '0+7.5x8'
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="example_app",process_id="42",mode="privileged"}'
        values: '0+7.5x8'
      - series: 'windows_process_start_time_seconds_timestamp{job="windows_exporter",instance="local",process="example_app",process_id="42"}'
        values: '1000+0x8'
      - series: 'windows_memory_physical_total_bytes{job="windows_exporter",instance="local"}'
        values: '8589934592+0x8'
      - series: 'windows_memory_available_bytes{job="windows_exporter",instance="local"}'
        values: '4294967296+0x8'
    promql_expr_test:
      - expr: pc_monitor:cpu_logical_processors:count
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:cpu_logical_processors:count{job="windows_exporter",instance="local"}'
            value: 2
      - expr: pc_monitor:cpu_usage:ratio
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:cpu_usage:ratio{job="windows_exporter",instance="local"}'
            value: 0.5
      - expr: pc_monitor:process_cpu_usage:cores
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:process_cpu_usage:cores{job="windows_exporter",instance="local",process="example_app",process_id="42"}'
            value: 1
      - expr: pc_monitor:process_cpu_usage:ratio
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:process_cpu_usage:ratio{job="windows_exporter",instance="local",process="example_app",process_id="42"}'
            value: 0.5
      - expr: pc_monitor:memory_used:ratio
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:memory_used:ratio{job="windows_exporter",instance="local"}'
            value: 0.5
      - expr: pc_monitor:memory_used:bytes
        eval_time: 2m
        exp_samples:
          - labels: 'pc_monitor:memory_used:bytes{job="windows_exporter",instance="local"}'
            value: 4294967296

  - name: observed_pid_reuse_suppresses_rate_spanning_process_restart
    interval: 15s
    input_series:
      - series: 'windows_cpu_time_seconds_total{job="windows_exporter",instance="local",core="0",mode="idle"}'
        values: '0+7.5x8'
      - series: 'windows_cpu_time_seconds_total{job="windows_exporter",instance="local",core="1",mode="idle"}'
        values: '0+7.5x8'
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="example_app",process_id="42",mode="user"}'
        values: '0+15x4 0+15x3'
      - series: 'windows_process_start_time_seconds_timestamp{job="windows_exporter",instance="local",process="example_app",process_id="42"}'
        values: '1000+0x4 2000+0x3'
    promql_expr_test:
      - expr: pc_monitor:process_cpu_usage:cores
        eval_time: 2m
        exp_samples: []
      - expr: pc_monitor:process_cpu_usage:ratio
        eval_time: 2m
        exp_samples: []

  - name: missing_capacity_and_memory_are_not_fabricated_as_healthy
    interval: 15s
    input_series:
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="example_app",process_id="42",mode="user"}'
        values: '0+15x8'
      - series: 'windows_process_start_time_seconds_timestamp{job="windows_exporter",instance="local",process="example_app",process_id="42"}'
        values: '1000+0x8'
    promql_expr_test:
      - expr: pc_monitor:process_cpu_usage:ratio
        eval_time: 2m
        exp_samples: []
      - expr: pc_monitor:memory_used:ratio
        eval_time: 2m
        exp_samples: []

  - name: idle_process_and_total_pseudo_process_are_excluded
    interval: 15s
    input_series:
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="Idle",process_id="0",mode="user"}'
        values: '0+15x8'
      - series: 'windows_process_cpu_time_seconds_total{job="windows_exporter",instance="local",process="_Total",process_id="1",mode="user"}'
        values: '0+15x8'
      - series: 'windows_process_start_time_seconds_timestamp{job="windows_exporter",instance="local",process="Idle",process_id="0"}'
        values: '1000+0x8'
      - series: 'windows_process_start_time_seconds_timestamp{job="windows_exporter",instance="local",process="_Total",process_id="1"}'
        values: '1000+0x8'
    promql_expr_test:
      - expr: pc_monitor:process_cpu_usage:cores
        eval_time: 2m
        exp_samples: []
